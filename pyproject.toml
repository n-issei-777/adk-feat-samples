[project]
name = "adk-feat-samples"
version = "0.1.0"
description = "Minimal sample agents for newly merged ADK features."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.7.0",
    "jinja2>=3.1.4,<4",
    "mcp",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[tool.uv]
# This repo is a collection of runnable sample scripts, not an installable
# package, so uv should not try to build/install the project itself.
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
pydantic-discarded-extra-argument = "ignore"
