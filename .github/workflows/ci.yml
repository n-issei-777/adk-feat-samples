name: verify-samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ADK
        run: |
          python -m pip install --upgrade pip
          pip install "google-adk>=2.5.0" mcp

      - name: Syntax check all samples (py_compile)
        run: |
          python -m compileall -q samples

      - name: Import smoke test each sample
        run: |
          # 各サンプルの agent.py を import して、モジュール読み込み時に
          # 例外（experimental未有効化など）が出ないことを確認する。
          # server.run() を走らせないよう __main__ ガードは実行されない。
          set -e
          for agent in samples/*/agent.py; do
            dir="$(dirname "$agent")"
            echo "::group::import $agent"
            (cd "$dir" && python -c "import importlib.util, pathlib; \
              spec = importlib.util.spec_from_file_location('sample_agent', 'agent.py'); \
              mod = importlib.util.module_from_spec(spec); \
              spec.loader.exec_module(mod); \
              print('OK:', pathlib.Path('agent.py').resolve())")
            echo "::endgroup::"
          done
