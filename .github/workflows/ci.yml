name: verify-samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment (uv + pyproject.toml)
        run: uv sync --locked
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Syntax check all samples (py_compile)
        run: uv run python -m compileall -q samples

      - name: Import smoke test each sample
        run: |
          # Import each sample's agent.py and confirm no exception is raised on
          # module load (e.g. an experimental feature left un-enabled).
          # The __main__ guard is not executed, so server.run() never starts.
          set -e
          for agent in samples/*/agent.py; do
            dir="$(dirname "$agent")"
            echo "::group::import $agent"
            (cd "$dir" && uv run python -c "import importlib.util, pathlib; \
              spec = importlib.util.spec_from_file_location('sample_agent', 'agent.py'); \
              mod = importlib.util.module_from_spec(spec); \
              spec.loader.exec_module(mod); \
              print('OK:', pathlib.Path('agent.py').resolve())")
            echo "::endgroup::"
          done
